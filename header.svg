<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window background -->
  <rect width="900" height="290" rx="12" ry="12" fill="#181818"/>

  <!-- Title bar -->
  <rect width="900" height="36" rx="12" ry="12" fill="#2e2e2e"/>
  <rect y="24" width="900" height="12" fill="#2e2e2e"/>

  <!-- Traffic light buttons -->
  <circle cx="20" cy="18" r="6.5" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6.5" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6.5" fill="#28c840"/>

  <!-- Title bar text (centered) -->
  <text x="450" y="23" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="11.5" fill="#888888">
    mardinajalah@github: ~ $ --name
  </text>

  <!-- ASCII Art: MARDIN — Banner3 style, 7 rows -->
  <!--
    ##    ##     ###     ########   ########   #### ##    ##
    ###  ###    ## ##    ##     ##  ##     ##  ##   ###   ##
    #### ####  ##   ##   ##     ##  ##     ##  ##   ####  ##
    ## ### ## ##     ##  ########   ##     ##  ##   ## ## ##
    ##     ## #########  ##   ##    ##     ##  ##   ##  ####
    ##     ## ##     ##  ##    ##   ##     ##  ##   ##   ###
    ##     ## ##     ##  ##     ##  ########  ####  ##    ##
  -->
  <text xml:space="preserve"
        font-family="'Courier New', Courier, monospace"
        font-size="10.8"
        font-weight="bold"
        fill="#e8e8e8"
        filter="url(#glow)"
        letter-spacing="0">
    <tspan x="14" y="92">##    ##     ###     ########   ########   #### ##    ##</tspan>
    <tspan x="14" dy="14">###  ###    ## ##    ##     ##  ##     ##  ##   ###   ##</tspan>
    <tspan x="14" dy="14">#### ####  ##   ##   ##     ##  ##     ##  ##   ####  ##</tspan>
    <tspan x="14" dy="14">## ### ## ##     ##  ########   ##     ##  ##   ## ## ##</tspan>
    <tspan x="14" dy="14">##     ## #########  ##   ##    ##     ##  ##   ##  ####</tspan>
    <tspan x="14" dy="14">##     ## ##     ##  ##    ##   ##     ##  ##   ##   ###</tspan>
    <tspan x="14" dy="14">##     ## ##     ##  ##     ##  ########  ####  ##    ##</tspan>
  </text>

  <!-- Separator line (subtle) -->
  <line x1="14" y1="212" x2="886" y2="212" stroke="#333333" stroke-width="1"/>

  <!-- Bottom terminal prompt -->
  <text x="14" y="232"
        font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4a4a4a">
    mardinajalah@github
  </text>
  <text x="148" y="232"
        font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#3a3a3a">
    ~$
  </text>
  <text x="168" y="232"
        font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#4a4a4a">
    --name
  </text>

  <!-- Blinking cursor block -->
  <rect x="214" y="220" width="7" height="13" fill="#aaaaaa">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom right: github label -->
  <text x="876" y="278"
        text-anchor="end"
        font-family="'Courier New', Courier, monospace"
        font-size="10" fill="#2e2e2e">
    github
  </text>
</svg>
